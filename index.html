<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clock">
<title>Desk Clock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Outfit:200,300,400&display=swap">
<style>
/* VOICE: quiet luxury — a watchmaker's desk piece with a choice of finishes
   IDEA: a chronograph dial; each colour theme is a different watch dial finish (midnight, emerald, royal, ocean, bordeaux, sand, pearl)
   PICTURE: the dial itself, filling the screen height
   COLOUR and TYPE: rich gradient grounds with a metal accent per theme; Outfit ultralight (Helvetica Neue fallback)
   LAYOUT: one centred dial; weekday above the time, date below; theme name fades in when changed */
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{background:#05070c;color:#f4efe4;font-family:"Outfit","Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:200;
  -webkit-user-select:none;-webkit-tap-highlight-color:rgba(0,0,0,0);cursor:pointer;
  -webkit-transition:color 1.2s;transition:color 1.2s}
.bg{position:absolute;top:0;left:0;right:0;bottom:0;-webkit-transition:opacity 1.2s;transition:opacity 1.2s}
.halo{position:absolute;left:50%;top:50%;width:120vmin;height:120vmin;margin:-60vmin 0 0 -60vmin;border-radius:50%;opacity:.35;
  -webkit-animation:breathe 9s ease-in-out infinite;animation:breathe 9s ease-in-out infinite}
@-webkit-keyframes breathe{0%,100%{opacity:.22;-webkit-transform:scale(.94)}50%{opacity:.42;-webkit-transform:scale(1.04)}}
@keyframes breathe{0%,100%{opacity:.22;transform:scale(.94)}50%{opacity:.42;transform:scale(1.04)}}
body.dim .face{opacity:.45}
body.dim .halo{display:none}
.stage{position:absolute;top:0;left:0;right:0;bottom:0;display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;
  -webkit-box-align:center;-webkit-align-items:center;align-items:center}
.face{position:relative;width:88vmin;height:88vmin;-webkit-transition:opacity 2s;transition:opacity 2s}
.face svg{position:absolute;top:0;left:0;width:100%;height:100%}
.inner{position:absolute;top:0;left:0;right:0;bottom:0;display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column;
  -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;
  -webkit-box-align:center;-webkit-align-items:center;align-items:center;text-align:center}
.wd{font-size:3.6vmin;font-weight:300;letter-spacing:.35em;text-transform:uppercase;margin-left:.35em;-webkit-transition:color 1.2s;transition:color 1.2s}
.time{font-size:21vmin;line-height:1;font-weight:200;letter-spacing:-.03em;white-space:nowrap;margin:2.2vmin 0 1.6vmin}
.time .c{display:inline-block;position:relative;top:-.07em;margin:0 .01em;opacity:.9;-webkit-transition:opacity .5s;transition:opacity .5s}
.time .c.off{opacity:.2}
.ap{font-size:3vmin;font-weight:400;letter-spacing:.3em;margin-bottom:1vmin;height:3.4vmin}
.sep{width:8vmin;height:1px;margin:1.6vmin auto 2.2vmin}
.dt{font-size:4.2vmin;font-weight:300;letter-spacing:.06em;opacity:.85}
.hj{font-size:3.5vmin;font-weight:300;letter-spacing:.06em;margin-top:1.4vmin;-webkit-transition:color 1.2s;transition:color 1.2s}
.side{position:absolute;display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column;
  -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;
  -webkit-box-align:center;-webkit-align-items:center;align-items:center;text-align:center;
  opacity:0;-webkit-transition:opacity 1.5s;transition:opacity 1.5s}
.side.on{opacity:1}
body.dim .side.on{opacity:.45}
#wx{left:0;top:0;bottom:0;width:-webkit-calc((100vw - 88vmin)/2);width:calc((100vw - 88vmin)/2)}
#aq{right:0;top:0;bottom:0;width:-webkit-calc((100vw - 88vmin)/2);width:calc((100vw - 88vmin)/2)}
.lbl{font-size:1.7vmin;font-weight:400;letter-spacing:.28em;text-transform:uppercase;margin-bottom:1.6vmin;opacity:.9}
.ico{width:9vmin;height:9vmin;margin-bottom:.8vmin}
.ico svg{width:100%;height:100%}
.big{font-size:8.5vmin;font-weight:200;line-height:1;letter-spacing:-.02em}
.cond{font-size:2.3vmin;font-weight:300;margin-top:1.2vmin;opacity:.9}
.sm{font-size:1.9vmin;font-weight:300;opacity:.7;margin-top:.8vmin;line-height:1.4}
.pill{display:inline-block;font-size:1.8vmin;font-weight:400;padding:.6vmin 1.6vmin;border-radius:3vmin;margin-top:1.4vmin;color:#111;line-height:1.3;max-width:92%}
.bar{width:14vmin;height:.6vmin;border-radius:.3vmin;margin:1.6vmin auto 0;position:relative;
  background:linear-gradient(to right,#3ecf6a 0%,#f5d742 20%,#f59a3a 35%,#e8443a 50%,#9b4fd1 75%,#7a1f3d 100%)}
.bar i{position:absolute;top:-.6vmin;width:1.8vmin;height:1.8vmin;margin-left:-.9vmin;border-radius:50%;background:#fff;box-shadow:0 0 0 .3vmin rgba(0,0,0,.35)}
.upd{position:absolute;bottom:14px;right:18px;font-size:11px;letter-spacing:.06em;opacity:0;font-weight:400;-webkit-transition:opacity 1.5s;transition:opacity 1.5s}
.upd.on{opacity:.35}
@media (orientation:portrait){
  #wx{left:0;right:0;top:0;bottom:auto;width:auto;height:-webkit-calc((100vh - 88vmin)/2);height:calc((100vh - 88vmin)/2)}
  #aq{left:0;right:0;bottom:0;top:auto;width:auto;height:-webkit-calc((100vh - 88vmin)/2);height:calc((100vh - 88vmin)/2)}
  .upd{bottom:6px}
}
.tname{position:absolute;top:22px;left:0;right:0;text-align:center;font-size:13px;letter-spacing:.3em;text-transform:uppercase;
  font-weight:400;opacity:0;-webkit-transition:opacity .6s;transition:opacity .6s}
.tname.on{opacity:.7}
.hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.08em;opacity:.4;font-weight:400;
  -webkit-transition:opacity 1s;transition:opacity 1s}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="halo" id="halo"></div>
<div class="tname" id="tname"></div>
<div class="stage">
  <div class="face" id="face">
    <svg viewBox="0 0 200 200" id="dial">
      <defs>
        <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
          <stop id="s1" offset="0" stop-color="#f3dca6"/>
          <stop id="s2" offset=".5" stop-color="#d9b878"/>
          <stop id="s3" offset="1" stop-color="#a9823e"/>
        </linearGradient>
      </defs>
      <circle cx="100" cy="100" r="97" fill="none" stroke="currentColor" stroke-opacity=".07" stroke-width=".6"/>
      <g id="ticks"></g>
      <circle cx="100" cy="100" r="92" fill="none" stroke="currentColor" stroke-opacity=".1" stroke-width="1.2"/>
      <circle id="arc" cx="100" cy="100" r="92" fill="none" stroke="url(#metal)" stroke-width="1.8" stroke-linecap="round"
        transform="rotate(-90 100 100)" stroke-dasharray="578.05 578.05" stroke-dashoffset="578.05"/>
      <circle id="glow" cx="100" cy="8" r="4.6" fill-opacity=".22"/>
      <circle id="dot" cx="100" cy="8" r="2.1"/>
    </svg>
    <div class="inner">
      <div class="wd" id="wd">&nbsp;</div>
      <div class="time"><span id="hh">--</span><span class="c" id="c">:</span><span id="mm">--</span></div>
      <div class="ap" id="ap"></div>
      <div class="sep" id="sep"></div>
      <div class="dt" id="dt">&nbsp;</div>
      <div class="hj" id="hj">&nbsp;</div>
    </div>
  </div>
</div>
<div class="side" id="wx">
  <div class="lbl acc">Riyadh</div>
  <div class="ico" id="wico"></div>
  <div class="big" id="wt">--&deg;</div>
  <div class="cond" id="wc">&nbsp;</div>
  <div class="sm" id="whl">&nbsp;</div>
  <div class="sm" id="wfh">&nbsp;</div>
</div>
<div class="side" id="aq">
  <div class="lbl acc">Air quality</div>
  <div class="big" id="aqv">--</div>
  <div class="pill" id="aqc">&nbsp;</div>
  <div class="bar"><i id="aqm"></i></div>
  <div class="sm" id="aqp">&nbsp;</div>
</div>
<div class="upd" id="upd"></div>
<div class="hint" id="hint">Tap · 12 / 24 hour &nbsp;&nbsp;&nbsp; Double-tap · change colour</div>
<script>
(function(){
  var NS="http://www.w3.org/2000/svg";
  var DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
  /* Umm al-Qura month starts, days since 1 Jan 2020, from 1 Muharram 1445 */
  var HS=[1295,1324,1354,1384,1414,1443,1473,1502,1531,1561,1590,1619,1649,1678,1708,1738,1768,1797,1827,1857,1886,1915,1945,1974,2003,2033,2062,2092,2122,2152,2181,2211,2240,2270,2299,2329,2358,2387,2417,2446,2476,2506,2535,2565,2595,2624,2654,2683,2713,2742,2771,2801,2830,2860,2889,2919,2949,2978,3008,3038,3067,3097,3126,3156,3185,3214,3244,3273,3303,3332,3362,3392,3421,3451,3481,3510,3540,3569,3598,3628,3657,3687,3716,3746,3775,3805,3835,3865,3894,3924,3953,3982,4012,4041,4071,4100,4130,4159,4189,4219,4249,4278,4307,4337,4366,4396,4425,4455,4484,4513,4543,4573,4603,4632,4662,4691,4721,4750,4780,4809,4839,4868,4897,4927,4957,4986,5016,5045,5075,5105,5134,5164,5193,5223,5252,5281,5311,5340,5370,5399,5429,5459,5489,5518,5548,5577,5607,5636,5665,5695,5724,5753,5783,5813,5842,5872,5902,5932,5961,5991,6020,6049,6079,6108,6137,6167,6197,6226,6256,6286,6316,6345,6375,6404,6433,6463,6492,6521,6551,6581,6610,6640,6670,6699,6729,6758,6788,6817,6847,6876,6905,6935,6965,6994,7024,7053,7083,7113,7142,7172,7201,7231,7260,7290,7319,7349,7378,7408,7437,7467,7496,7526,7555,7585,7615,7644,7674,7703,7733,7762,7791,7821,7850,7880,7910,7939,7969,7999,8028,8058,8087,8117,8146,8175,8205,8234,8264,8293,8323,8353,8383,8412,8442,8471,8501,8530,8559,8589,8618,8647,8677,8707,8737,8767,8796,8826,8855,8885,8914,8943,8973,9002,9032,9061,9091,9121,9150,9180,9210,9239,9269,9298,9327,9357,9386,9416,9445,9475,9504,9534,9564,9593,9623,9652,9682,9711,9741,9770,9800,9829,9858,9888,9918,9947,9977,10007,10036,10066,10096,10125,10154,10184,10213,10242,10272,10302,10331,10361,10390,10420,10450,10480,10509,10538,10568,10597,10626,10656,10685,10715,10745,10774,10804,10834,10863,10893,10922,10952,10981,11011,11040,11069,11099,11128,11158,11188,11217,11247,11276,11306,11336,11365,11395,11424,11453,11483,11512,11542,11571,11601,11631,11660,11690,11720,11749,11779,11808,11837,11867,11896,11926,11955,11985,12014,12044,12074,12104,12133,12163,12192,12221,12251];
  var HM=["Muharram","Safar","Rabi al-Awwal","Rabi al-Thani","Jumada al-Ula","Jumada al-Akhirah","Rajab","Sha\u2019ban","Ramadan","Shawwal","Dhu al-Qa\u2019dah","Dhu al-Hijjah"];
  function hijri(d){
    var n=Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(2020,0,1))/86400000);
    if(n<HS[0]||n>=HS[HS.length-1]+30) return "";
    var i=HS.length-1; while(i>0&&HS[i]>n) i--;
    return (n-HS[i]+1)+" "+HM[i%12]+" "+(1445+Math.floor(i/12))+" AH";
  }
  /* name, ground gradient [centre, mid, edge], text, accent, metal [light, mid, deep], halo */
  var THEMES=[
    ["Midnight Gold",["#1d2740","#0c1120","#04060b"],"#f6f0e4","#e0bd78",["#f7e2ae","#e0bd78","#a8803b"],"#3a4d80"],
    ["Emerald",      ["#0f4a3c","#062a22","#021410"],"#f1f6ef","#e3c27e",["#f6e2b0","#e3c27e","#a7823f"],"#1d8a6c"],
    ["Royal Amethyst",["#3b1f66","#1d0f3a","#0b0519"],"#f6f0fb","#f0b7c9",["#ffd9e3","#f0b7c9","#b87790"],"#7b47c9"],
    ["Ocean",        ["#0c4a6e","#06283f","#02121e"],"#eef8fc","#6fe0e8",["#c7fbff","#6fe0e8","#2a9fb0"],"#1689b5"],
    ["Bordeaux",     ["#5c1626","#300b15","#140408"],"#fbefe9","#ff9f7a",["#ffd1bd","#ff9f7a","#c9603d"],"#a82f45"],
    ["Desert Sand",  ["#f6e7cf","#e9d0aa","#c9a87c"],"#3a2717","#9a5b2a",["#c98a55","#9a5b2a","#6b3a17"],"#ffffff"],
    ["Pearl",        ["#ffffff","#f2eee6","#dcd4c6"],"#1d1a15","#a07a38",["#d4b06a","#a07a38","#6f5020"],"#ffffff"]
  ];
  var C=578.05, R=92, h24=false, ti=0, lastTap=0, tapTimer=null, lastMin=-1, nameTimer=null, majors=[];
  try{ h24=localStorage.getItem("clk24")==="1"; ti=parseInt(localStorage.getItem("clkTheme")||"0",10)||0; }catch(e){}
  if(ti<0||ti>=THEMES.length) ti=0;
  function $(id){return document.getElementById(id);}
  function pad(n){return n<10?"0"+n:""+n;}
  function save(){ try{ localStorage.setItem("clk24",h24?"1":"0"); localStorage.setItem("clkTheme",String(ti)); }catch(e){} }
  function hexA(h,a){ var n=parseInt(h.slice(1),16); return "rgba("+(n>>16&255)+","+(n>>8&255)+","+(n&255)+","+a+")"; }

  var g=$("ticks");
  for(var i=0;i<60;i++){
    var a=i*6*Math.PI/180, major=(i%5===0), r1=major?83:85.5, r2=88;
    var l=document.createElementNS(NS,"line");
    l.setAttribute("x1",100+r1*Math.sin(a)); l.setAttribute("y1",100-r1*Math.cos(a));
    l.setAttribute("x2",100+r2*Math.sin(a)); l.setAttribute("y2",100-r2*Math.cos(a));
    l.setAttribute("stroke","currentColor");
    l.setAttribute("stroke-opacity", major ? ".95" : ".25");
    l.setAttribute("stroke-width", major ? "1.1" : ".5");
    l.setAttribute("stroke-linecap","round");
    g.appendChild(l);
    if(major) majors.push(l);
  }

  function applyTheme(showName){
    var t=THEMES[ti], gr=t[1];
    $("bg").style.background="radial-gradient(ellipse at 50% 45%,"+gr[0]+" 0%,"+gr[1]+" 50%,"+gr[2]+" 100%)";
    $("halo").style.background="radial-gradient(circle,"+hexA(t[5],.55)+" 0%,"+hexA(t[5],0)+" 65%)";
    document.body.style.color=t[2];
    $("wd").style.color=t[3]; $("ap").style.color=t[3]; $("tname").style.color=t[3]; $("hj").style.color=t[3]; var ac=document.querySelectorAll(".acc"); for(var q=0;q<ac.length;q++) ac[q].style.color=t[3];
    $("sep").style.background="linear-gradient(to right,"+hexA(t[3],0)+","+t[3]+","+hexA(t[3],0)+")";
    $("s1").setAttribute("stop-color",t[4][0]); $("s2").setAttribute("stop-color",t[4][1]); $("s3").setAttribute("stop-color",t[4][2]);
    $("dot").setAttribute("fill",t[4][0]); $("glow").setAttribute("fill",t[3]);
    for(var k=0;k<majors.length;k++) majors[k].setAttribute("stroke",t[3]);
    if(showName){
      $("tname").innerHTML=t[0]; $("tname").className="tname on";
      clearTimeout(nameTimer); nameTimer=setTimeout(function(){ $("tname").className="tname"; },2500);
    }
  }
  function frame(){
    var d=new Date(), s=d.getSeconds(), ms=d.getMilliseconds(), m=d.getMinutes();
    var frac=(s+ms/1000)/60;
    $("arc").setAttribute("stroke-dashoffset",(C*(1-frac)).toFixed(2));
    var a=frac*2*Math.PI, x=(100+R*Math.sin(a)).toFixed(2), y=(100-R*Math.cos(a)).toFixed(2);
    $("dot").setAttribute("cx",x); $("dot").setAttribute("cy",y);
    $("glow").setAttribute("cx",x); $("glow").setAttribute("cy",y);
    $("c").className="c"+(s%2?" off":"");
    if(m!==lastMin){ lastMin=m; draw(d); }
  }
  function draw(d){
    d=d||new Date();
    var h=d.getHours(), m=d.getMinutes(), showH=h, ap="";
    if(!h24){ ap=h<12?"AM":"PM"; showH=h%12; if(showH===0) showH=12; }
    $("hh").innerHTML = h24 ? pad(showH) : String(showH);
    $("mm").innerHTML = pad(m);
    $("ap").innerHTML = ap;
    $("wd").innerHTML = DAYS[d.getDay()];
    $("dt").innerHTML = d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear();
    $("hj").innerHTML = hijri(d)||"&nbsp;";
    var isLight=(ti>=5), night=(h>=22||h<6);
    document.body.className=(night&&!isLight)?"dim":"";
  }
  function onTap(){
    var now=new Date().getTime();
    if(now-lastTap<350){ clearTimeout(tapTimer); ti=(ti+1)%THEMES.length; save(); applyTheme(true); draw(); lastTap=0; return; }
    lastTap=now;
    tapTimer=setTimeout(function(){ h24=!h24; save(); draw(); },360);
  }

  /* ---- weather and air quality (weather.json is refreshed every 30 min by a GitHub Action) ---- */
  function wxText(c){
    if(c===0) return "Clear"; if(c===1) return "Mainly clear"; if(c===2) return "Partly cloudy"; if(c===3) return "Overcast";
    if(c===45||c===48) return "Fog"; if(c>=51&&c<=57) return "Drizzle"; if(c>=61&&c<=67) return "Rain";
    if(c>=71&&c<=77) return "Snow"; if(c>=80&&c<=82) return "Showers"; if(c>=95) return "Thunderstorm"; return "";
  }
  var SUN='<circle cx="24" cy="24" r="8"/><path d="M24 6v5M24 37v5M6 24h5M37 24h5M11.3 11.3l3.5 3.5M33.2 33.2l3.5 3.5M11.3 36.7l3.5-3.5M33.2 14.8l3.5-3.5"/>';
  var MOON='<path d="M30 8a16 16 0 1 0 10 26A13 13 0 0 1 30 8z"/>';
  var CLOUD='<path d="M14 36h20a8 8 0 0 0 0-16 11 11 0 0 0-21-2 7 7 0 0 0 1 18z"/>';
  var CLOUDUP='<path d="M14 31h20a8 8 0 0 0 0-16 11 11 0 0 0-21-2 7 7 0 0 0 1 18z"/>';
  function icon(kind,day){
    var p;
    if(kind==="clear") p=day?SUN:MOON;
    else if(kind==="partly") p=(day?'<g transform="translate(-6 -6) scale(.7)">'+SUN+'</g>':'<g transform="translate(-4 -6) scale(.6)">'+MOON+'</g>')+'<path d="M18 38h17a7 7 0 0 0 0-14 9 9 0 0 0-17-1 6 6 0 0 0 0 15z"/>';
    else if(kind==="cloud") p=CLOUD;
    else if(kind==="rain") p=CLOUDUP+'<path d="M17 36l-2 6M25 36l-2 6M33 36l-2 6"/>';
    else if(kind==="storm") p=CLOUDUP+'<path d="M25 33l-4 7h6l-4 7"/>';
    else if(kind==="snow") p=CLOUDUP+'<path d="M17 38v4M25 38v4M33 38v4"/>';
    else p='<path d="M8 16c4-3 8 3 12 0s8-3 12 0 6 1 8 0M8 25c4-3 8 3 12 0s8-3 12 0 6 1 8 0M8 34c4-3 8 3 12 0s8-3 12 0 6 1 8 0"/>';
    return '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
  }
  function aqiInfo(v){
    if(v<=50) return ["Good","#3ecf6a"]; if(v<=100) return ["Moderate","#f5d742"];
    if(v<=150) return ["Unhealthy for sensitive groups","#f59a3a"]; if(v<=200) return ["Unhealthy","#e8443a"];
    if(v<=300) return ["Very unhealthy","#b07ae0"]; return ["Hazardous","#c2456a"];
  }
  function fmtTime(d){ var h=d.getHours(), m=d.getMinutes(); if(h24) return pad(h)+":"+pad(m); return (h%12||12)+":"+pad(m)+(h<12?" AM":" PM"); }
  function showWx(j){
    try{
      var w=j.weather.current, dl=j.weather.daily, a=j.air.current;
      var upd=new Date(j.updated);
      if(new Date().getTime()-upd.getTime()>3*3600000){ $("wx").className="side"; $("aq").className="side"; return; }
      var c=w.weather_code, day=w.is_day===1, dusty=(a.dust>300||a.pm10>250), kind;
      if(c>=95) kind="storm"; else if((c>=51&&c<=67)||(c>=80&&c<=82)) kind="rain"; else if(c>=71&&c<=77) kind="snow";
      else if(dusty||c===45||c===48) kind="haze"; else if(c===0||c===1) kind="clear"; else if(c===2) kind="partly"; else kind="cloud";
      $("wico").innerHTML=icon(kind,day);
      $("wt").innerHTML=Math.round(w.temperature_2m)+"&deg;";
      $("wc").innerHTML=(dusty&&c<45)?"Dusty":wxText(c);
      $("whl").innerHTML="H "+Math.round(dl.temperature_2m_max[0])+"&deg; &nbsp;&middot;&nbsp; L "+Math.round(dl.temperature_2m_min[0])+"&deg;";
      $("wfh").innerHTML="Feels "+Math.round(w.apparent_temperature)+"&deg; &nbsp;&middot;&nbsp; "+Math.round(w.relative_humidity_2m)+"%";
      var v=Math.round(a.us_aqi), inf=aqiInfo(v);
      $("aqv").innerHTML=v; $("aqv").style.color=inf[1];
      $("aqc").innerHTML=inf[0]; $("aqc").style.background=inf[1];
      $("aqm").style.left=Math.min(100,v/400*100)+"%";
      $("aqp").innerHTML="PM2.5 "+Math.round(a.pm2_5)+" &nbsp;&middot;&nbsp; PM10 "+Math.round(a.pm10);
      $("upd").innerHTML="Weather updated "+fmtTime(upd);
      $("wx").className="side on"; $("aq").className="side on"; $("upd").className="upd on";
    }catch(e){}
  }
  function getJSON(url,ok,fail){
    try{
      var x=new XMLHttpRequest(); x.open("GET",url+(url.indexOf("?")<0?"?":"&")+"t="+new Date().getTime(),true);
      x.onreadystatechange=function(){ if(x.readyState!==4) return;
        if(x.status===200){ try{ ok(JSON.parse(x.responseText)); return; }catch(e){} } if(fail) fail(); };
      x.send();
    }catch(e){ if(fail) fail(); }
  }
  function loadWx(){
    getJSON("weather.json",showWx,function(){
      getJSON("https://raw.githubusercontent.com/sarfraz9383/sarfraz9383.github.io/main/weather.json",showWx,null);
    });
  }
  document.body.addEventListener("click",onTap,false);
  setTimeout(function(){ $("hint").style.opacity="0"; },15000);
  applyTheme(false); draw(); frame();
  setInterval(frame,200);
  loadWx(); setInterval(loadWx,10*60000);
})();
</script>
